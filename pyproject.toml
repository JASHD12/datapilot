[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-workbench"
version = "0.4.0"
description = "A reproducible ML and evidence workbench for structured data and documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jashdeep Singh"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ai = ["langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2"]
semantic = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1"]
tracking = ["mlflow>=3,<4"]

[project.scripts]
datapilot = "datapilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

