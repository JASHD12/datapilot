name: Verify DataPilot
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pytest
      - run: python scripts/build_demo.py --check
      - run: python scripts/build_public.py --check
      - run: python scripts/build_browser_sample.py --check
      - run: python scripts/check_research.py
      - run: node --check frontend/app.js
      - run: node scripts/test_browser_training.mjs
      - run: node --check frontend/semantic-search.js
      - run: node scripts/test_semantic_search.mjs
      - run: node --check frontend/generation.js
      - run: node scripts/test_generation.mjs --require-artifact

